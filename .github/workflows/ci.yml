name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  GCC_VERSION: 16
  CLANG_VERSION: 23

jobs:
  gcc-libstdcxx:
    name: gcc + libstdc++
    runs-on: ubuntu-26.04
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC ${{ env.GCC_VERSION }}
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --allow-downgrade --no-recommends gcc${{ env.GCC_VERSION }} gcc${{ env.GCC_VERSION }}-c++ cmake ninja

      - name: Configure
        env:
          CC: gcc-${{ env.GCC_VERSION }}
          CXX: g++-${{ env.GCC_VERSION }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  clang-libstdcxx:
    name: clang + libstdc++
    runs-on: ubuntu-26.04
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --allow-downgrade --no-recommends clang${{ env.CLANG_VERSION }} libstdc++6-devel-gcc${{ env.GCC_VERSION }} cmake ninja

      - name: Configure
        env:
          CC: clang-${{ env.CLANG_VERSION }}
          CXX: clang++-${{ env.CLANG_VERSION }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  clang-libcxx:
    name: clang + libc++
    runs-on: ubuntu-26.04
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.CLANG_VERSION }} and libc++
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --allow-downgrade --no-recommends clang${{ env.CLANG_VERSION }} libc++-devel cmake ninja

      - name: Configure
        env:
          CC: clang-${{ env.CLANG_VERSION }}
          CXX: clang++-${{ env.CLANG_VERSION }}
          CXXFLAGS: -stdlib=libc++
          LDFLAGS: -stdlib=libc++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
